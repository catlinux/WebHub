# WebHub en Docker: el código se monta de solo lectura y solo data/ es escribible.
# El puerto se publica únicamente en 127.0.0.1; delante va el proxy inverso (Apache o Caddy).
# Tu dominio va en el archivo .env (copia .env.ejemplo; .env no se sube a Git). Ajusta "user" al uid:gid dueño del directorio (id -u, id -g).
#
#   docker compose run --rm build          # npm ci + public/app.js (también tras cada git pull)
#   docker compose run --rm webhub npm run pin
#   docker compose up -d

x-comun: &comun
  image: node:22-alpine
  user: "1001:1001"
  working_dir: /app
  environment: &entorno
    HOME: /tmp

services:
  webhub:
    <<: *comun
    command: ["node", "--disable-warning=ExperimentalWarning", "src/server/main.ts"]
    environment:
      <<: *entorno
      NODE_ENV: production
      WEBHUB_HOST: 0.0.0.0
      WEBHUB_PORT: "3000"
      WEBHUB_DATA_DIR: /app/data
      WEBHUB_TRUST_PROXY: "1"
      WEBHUB_PUBLIC_ORIGIN: ${WEBHUB_PUBLIC_ORIGIN:?Define WEBHUB_PUBLIC_ORIGIN en el archivo .env (copia .env.ejemplo)}
    volumes:
      - .:/app:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/session').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  build:
    <<: *comun
    profiles: [herramientas]
    command: ["sh", "-c", "npm ci && npm run build"]
    volumes:
      - .:/app
